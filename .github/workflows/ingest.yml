name: Ingesta diaria

# Mister resuelve el mercado a las 05:00 y saca su oferta a las 17:00, HORA
# ESPANOLA (docs/INCOGNITAS.md punto 4). En UTC eso son las 03:00 y 15:00 en
# verano, y las 04:00 y 16:00 en invierno.
#
# Las cuatro pasadas cubren las dos estaciones: 04:20 y 16:20 llegan 80 minutos
# despues en verano y 20 en invierno, y las de 05:20 y 17:20 son el respaldo
# por si Mister se retrasa. Ejecutar de mas es gratis y el job es idempotente.
on:
  schedule:
    - cron: '20 4,5,16,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ingerir y analizar sin escribir nada'
        type: boolean
        default: false

# El cron de GitHub llega tarde con frecuencia y puede solaparse con un disparo
# manual. Nunca dos ingestas a la vez contra la misma cuenta.
concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      # Los datos viven en un repositorio PRIVADO aparte. Contienen el saldo y
      # los movimientos de la cuenta, y las estimaciones de saldo de los nueve
      # rivales; la liga tiene desactivado ver el saldo ajeno, asi que
      # publicarlos expondria justo lo que la liga decidio ocultar, y sobre
      # gente que no ha elegido nada. El codigo sigue siendo publico porque el
      # codigo no filtra nada.
      # El checkout falla con un "Not Found" cripticoo cuando el token no
      # alcanza el repositorio, y ese mensaje no distingue entre "no existe",
      # "no tengo permiso" y "el token no lo ve". Esta comprobacion previa si
      # lo distingue, y ahorra ejecuciones de diez minutos para descubrirlo.
      - name: Comprobar el acceso al repositorio de datos
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO: francisconaranjonrvz/mls-fantasy-data
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secret DATA_REPO_TOKEN."
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}'             -H "Authorization: Bearer $TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO")
          echo "GET /repos/$REPO -> HTTP $CODE"
          case "$CODE" in
            200) echo "Acceso correcto." ;;
            404)
              echo "::error::El token NO ve $REPO. En los tokens fine-grained, 'Repository access' viene por defecto en 'Public repositories', y con eso un repositorio privado es invisible. Cambialo a 'Only select repositories' y marca mls-fantasy-data."
              exit 1 ;;
            403)
              echo "::error::El token ve el repositorio pero le faltan permisos. Necesita 'Contents: Read and write'."
              exit 1 ;;
            401)
              echo "::error::El token no es valido o ha caducado."
              exit 1 ;;
            *)
              echo "::error::Respuesta inesperada de GitHub: HTTP $CODE"
              exit 1 ;;
          esac

      - name: Descargar el repositorio de datos (privado)
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          repository: francisconaranjonrvz/mls-fantasy-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ingerir y analizar
        env:
          # Via principal: sesion capturada del navegador. Es la unica que
          # funciona con cuentas que entran con Google.
          MISTER_SESSION: ${{ secrets.MISTER_SESSION }}
          # Alternativa, solo si la cuenta tiene contrasena propia de Mister.
          MISTER_EMAIL: ${{ secrets.MISTER_EMAIL }}
          MISTER_PASSWORD: ${{ secrets.MISTER_PASSWORD }}
          MISTER_LEAGUE_ID: ${{ secrets.MISTER_LEAGUE_ID }}
          # Ritmo prudente: la API no esta documentada y no publica limites.
          THROTTLE_MS: '2500'
          DATA_DIR: ${{ inputs.dry_run && 'data' || 'data-repo/data' }}
        run: node apps/scraper/src/main.ts ${{ inputs.dry_run && '--dry-run' || '' }}

      # Lo que hace que el sistema aguante una temporada sin que nadie lo toque.
      #
      # La credencial de larga duracion es la cookie refresh-token. Su
      # vencimiento declarado esta en 2125, asi que no caduca sola; el riesgo
      # es que Mister la ROTE. Si la rota, el secret guardado se queda viejo y
      # la ingesta de manana entra con una credencial muerta.
      #
      # El scraper detecta la rotacion y deja la nueva en un fichero. Aqui se
      # escribe encima del secret. Nunca pasa por el log: `gh secret set` lee
      # de un fichero y GitHub cifra el valor antes de guardarlo.
      #
      # Necesita un token con permiso de escritura sobre los secrets del
      # repositorio; el GITHUB_TOKEN por defecto no lo tiene.
      - name: Renovar el secret de sesion si Mister la roto
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.SESSION_ROTATE_TOKEN }}
        run: |
          if [ ! -f session-renewed.txt ]; then
            echo "La sesion no cambio; no hay nada que renovar."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Mister roto la sesion pero falta el secret SESSION_ROTATE_TOKEN, asi que no se puede guardar la nueva. La proxima ingesta fallara. Vuelve a capturar la sesion a mano."
            exit 0
          fi
          gh secret set MISTER_SESSION < session-renewed.txt
          echo "::notice::Mister roto la sesion y el secret MISTER_SESSION se ha actualizado solo."
          rm -f session-renewed.txt

      - name: Commitear los datos en el repositorio privado
        if: ${{ !inputs.dry_run }}
        working-directory: data-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # meta.json lleva siempre una marca de tiempo, asi que cada ejecucion
          # produce un commit. Eso mantiene vivo el repositorio y evita que
          # GitHub desactive el cron por 60 dias sin actividad.
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "datos: ingesta $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # El diagnostico contiene saldos, asi que va al resumen del run y no al
      # log. El resumen de un repo publico tambien es publico, de modo que solo
      # se publica cuando la ingesta escribe en el repo privado; en dry-run se
      # omite a proposito.
      - name: Publicar el diagnostico en el resumen del run
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if [ -f data-repo/data/2026-27/diagnostico.md ]; then
            echo "Diagnostico generado. Disponible en el repositorio privado de datos." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se genero diagnostico en esta ejecucion." >> "$GITHUB_STEP_SUMMARY"
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Un solo comando: el tsconfig.json raiz encadena los seis proyectos en
      # orden de dependencia, incluido el dashboard, que antes se quedaba
      # fuera de la comprobacion de tipos.
      - name: Comprobar tipos
        run: pnpm exec tsc -b --force

      - name: Lint
        run: pnpm exec eslint .

      - name: Tests
        run: pnpm exec vitest run

      - name: Compilar el dashboard
        run: pnpm --filter @mls/web build

      # Recorre ingesta, validacion, analisis e informe con datos sinteticos.
      # Si algo del pipeline se rompe, salta aqui sin depender de que Mister
      # este en pie ni de tener credenciales.
      - name: Humo del pipeline completo
        run: node apps/scraper/src/main.ts --demo --dry-run
